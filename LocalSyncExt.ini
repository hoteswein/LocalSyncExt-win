; LocalSyncExt — пример конфигурации (кодировка UTF-8)
; Строка с путём (C:\... или \\сервер\...) — участник правила, остальное — опции ключ=значение.

[Settings]
; StartInTray=1       (будет в GUI-версии)
; Notifications=1
; LogFile=C:\Logs\LocalSyncExt.log
; Notifications=1         уведомления Windows (в меню трея переключается и запоминается)
; TrayClick=status        левый щелчок по значку: status | syncnow | pause | ui | log | config | notify | none
; TrayDoubleClick=ui      двойной щелчок левой кнопкой: те же значения, плюс ui — открыть веб-интерфейс
; StateDir=C:\ProgramData\LocalSyncExt\state
; WorkDir=C:\Tools\LocalSyncExt\work   рабочая папка (по умолчанию work рядом с exe); не должна лежать внутри синхронизируемых путей
; Значения по умолчанию для всех правил (в правиле можно переопределить):
; Trash=folder       куда складывать удалённое/заменённое: folder (.LocalSyncTrash в папке), work (в WorkDir) или полный путь
; Temp=prefix        временные файлы для больших файлов: prefix (рядом, LocalSyncExt-ДАТА-ВРЕМЯ-имя) или work (в WorkDir\tmp, только на том же диске)
; DirectBelow=1024   файлы не больше N КБ пишутся сразу, без временного файла (0 — всегда через временный)
; Настройки правил можно менять, пока программа работает: файл перечитывается сам.

; --- Веб-интерфейс (все настройки и правила можно менять на странице) ---
; WebUI=1                  0 — выключить веб-интерфейс совсем
; Порт БЕЗ авторизации: для доверенных сетей (ZeroTier, локальная сеть). Закройте внешний доступ брандмауэром Windows!
WebPortOpen=20001
WebOpenBind=0.0.0.0        ; 127.0.0.1 — только этот компьютер; 0.0.0.0 — все сетевые интерфейсы
; Порт с логином и паролем (cookie на 30 дней). Логин и пароль задаются на странице настроек или командой
; LocalSyncExt-cli.exe -web-user ИМЯ -web-pass ПАРОЛЬ
WebPortAuth=20002
WebAuthBind=0.0.0.0
; WebHosts=mypc.zt         имена узлов, по которым разрешён доступ (по IP и localhost — всегда)

; Двусторонняя синхронизация трёх папок
[Rule 1]
description=Рабочие документы: C ⇄ E
mode=twoway
conflict=auto
scan=60
TrashDays=30
ignore=*.bak;~$*
C:\1--Loacal-folder-TEST-C\CE
E:\1--Loacal-folder-TEST-E\CE

; Односторонняя: главная — первая в списке (master=1), остальные становятся её копией
[Mirror CD]
mode=oneway
master=1
TrashDays=7
C:\1--Loacal-folder-TEST-C\CD
D:\1--Loacal-folder-TEST-D\CD

; Только PDF-файлы (маска), без вложенных папок
[PDF only]
recursive=0
C:\1--Loacal-folder-TEST-C\CG\*.pdf
G:\1--Loacal-folder-TEST-G\CG

; Резервная папка без служебных файлов: маркер выключен для пути №2, корзина и временные файлы вынесены в WorkDir.
; Защита от подмены диска остаётся (путь + серийный номер тома + база в папке state).
[Backup clean]
mode=oneway
master=1
nomarker=2
TrashDays=30
Trash=work
Temp=work
watch=1
debounce=3000
C:\1--Loacal-folder-TEST-C\CEG
G:\1--Loacal-folder-TEST-G\CEG
