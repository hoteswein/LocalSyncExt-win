name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: vet, test, build
        id: build
        run: |
          mkdir -p out
          rc=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME}"; else VER="dev-${GITHUB_SHA::7}"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          {
            echo "== version $VER"; go version
            echo "== gofmt (только информация)"; gofmt -l . || true
            echo "== go vet"; go vet ./... || rc=1
            echo "== go test"; go test -count=1 -v ./... || rc=1
            echo "== resources (иконка, манифест)"
            go install github.com/akavel/rsrc@v0.10.2 && "$(go env GOPATH)/bin/rsrc" -ico assets/app.ico -manifest assets/app.manifest -arch amd64 -o rsrc_windows_amd64.syso || echo "WARN: ресурсы не встроены"
            echo "== go build (GUI, трей, без консоли)"
            go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$VER -X main.guiBuild=1" -o out/LocalSyncExt.exe . || rc=1
            echo "== go build (CLI, консоль)"
            go build -trimpath -ldflags "-s -w -X main.version=$VER" -o out/LocalSyncExt-cli.exe . || rc=1
            echo "== smoke: запуск собранных exe"
            ./out/LocalSyncExt-cli.exe -version || rc=1
            ./out/LocalSyncExt-cli.exe -check -config LocalSyncExt.ini || rc=1
            ./out/LocalSyncExt.exe -version > out/gui-version.txt 2>&1 || rc=1
            echo "GUI exe -version: $(cat out/gui-version.txt)"
            echo "== result rc=$rc"
          } > out/build.log 2>&1
          cat out/build.log
          cp LocalSyncExt.ini out/LocalSyncExt.ini
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: publish log to branch build-logs
        if: always()
        run: |
          git config --global user.name "build-bot"
          git config --global user.email "build-bot@users.noreply.github.com"
          d="$(mktemp -d)"
          cp out/build.log "$d/build.log"
          echo "run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} ver=${{ steps.build.outputs.ver }} rc=${{ steps.build.outputs.rc }}" > "$d/info.txt"
          cd "$d"
          git init -q
          git checkout -q -b build-logs
          git add .
          git commit -q -m "log for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: LocalSyncExt-win-${{ steps.build.outputs.ver }}
          path: |
            out/LocalSyncExt.exe
            out/LocalSyncExt-cli.exe
            out/LocalSyncExt.ini
            out/build.log

      - name: fail if build had errors
        if: steps.build.outputs.rc != '0'
        run: exit 1

      - name: create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.build.outputs.ver }}"
          cp out/LocalSyncExt.exe "out/LocalSyncExt-${VER}-win-amd64.exe"
          cp out/LocalSyncExt-cli.exe "out/LocalSyncExt-cli-${VER}-win-amd64.exe"
          awk -v t="## ${VER}" 'index($0,t)==1{p=1;print;next} /^## /{p=0} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Релиз ${VER}" > notes.md; fi
          gh release create "$VER" "out/LocalSyncExt-${VER}-win-amd64.exe" "out/LocalSyncExt-cli-${VER}-win-amd64.exe" out/LocalSyncExt.ini \
            --title "LocalSyncExt ${VER}" --notes-file notes.md
